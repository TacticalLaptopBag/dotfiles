# kitty_mod+F2 to edit this file
# kitty_mod+F5 to reload this config
#
# By default, kitty_mod is ctrl+shift:
# kitty_mod ctrl+shift

# Default shell
shell /bin/zsh

# Fonts
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11
# Zoom with kitty_mod++ and kitty_mod+-
# Reset zoom with kitty_mod+Backspace

# Multiplexing
# Kitty, like tmux, can multiplex terminals. Press kitty_mod+Enter to open a new terminal.
# Press kitty_mod+L to cycle through layouts.
# See https://sw.kovidgoyal.net/kitty/layouts for more details on layouts
# You can set the default layout below. The * indicates all other layouts can still be switched to.
# enabled_layouts tall,*
enabled_layouts tall,fat,grid

# Window
# kitty_mod+[1-9,0] to select windows
# kitty_mod+[ to select previous window
# kitty_mod+] to select next window
single_window_margin_width 1 4
single_window_padding_width 0
window_margin_width 1
window_padding_width 2
window_border_width 1
inactive_border_color #9c8e78
active_border_color #a0dbe7

# Background
background_image ~/Pictures/Hathmere.webp
background_image_layout cscaled

background_tint 0.95
background_tint_gaps 0

# Tabs
# kitty_mod+T to create new tab
# kitty_mod+Q to close a tab
# kitty_mod+Arrows to navigate tabs
tab_bar_style powerline
tab_powerline_style angled
# tab_bar_show_new_tab_button yes
tab_activity_symbol "[!] "

# Cursor trail
cursor_trail 1
cursor_trail_decay 0.1 0.4

# Modify this using `kitten theme`
# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

# Shortcuts
map kitty_mod+h launch htop
# map kitty_mod+g send_text all git status\x0d
# map kitty_mod+c send_text all clear\x0d
map kitty_mod+i>c launch --title "timecard config" nvim ~/.config/timecard/timecard-cli.toml
map kitty_mod+i>s launch --title "timecard status" sh -c "~/.cargo/bin/timecard; echo; echo 'Press Enter to exit...'; read _"
map kitty_mod+i>i launch --title "timecard clock In" sh -c "~/.cargo/bin/timecard in; echo; echo 'Press Enter to exit...'; read _"
map kitty_mod+i>o launch --title "timecard clock Out" sh -c "~/.cargo/bin/timecard out; echo; echo 'Press Enter to exit...'; read _"
map kitty_mod+i>z launch --title "timecard undo" sh -c "~/.cargo/bin/timecard undo; echo; echo 'Press Enter to exit...'; read _"
map kitty_mod+g launch --cwd current lazygit

